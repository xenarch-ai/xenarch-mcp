name: Publish — npm (OIDC Trusted Publishing)

# Publishes @xenarch/core and @xenarch/agent-mcp to npm with NO stored token.
# Authentication is npm Trusted Publishing: this workflow exchanges a
# short-lived GitHub OIDC token with the registry (provenance attached).
# Configure it once per package at
#   npmjs.com → package → Settings → Trusted Publisher
#   repo: xenarch-ai/xenarch-mcp · workflow: publish.yml
#
# Trigger: a published GitHub Release whose tag names the package + version:
#   core-v1.2.2       → packages/shared  (@xenarch/core)
#   agent-mcp-v1.3.3  → packages/agent   (@xenarch/agent-mcp)
# The tag version must equal that package.json version. When both change,
# release core first, then agent-mcp.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "core or agent-mcp"
        required: true
        type: choice
        options: [core, agent-mcp]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # REQUIRED for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm >= 11.5.1; setup-node ships an older npm.
      - name: Upgrade npm (OIDC support)
        # npm 12 needs node >=22.22.2; npm 11 (>=11.5.1) has OIDC trusted publishing and runs on node 22 (XEN-691).
        run: npm install -g npm@11

      # Untrusted inputs go through env vars, never inline in the shell.
      - name: Resolve package
        id: pkg
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then NAME="$INPUT_PACKAGE"; else NAME="${TAG%-v*}"; fi
          case "$NAME" in
            core) DIR=packages/shared ;;
            agent-mcp) DIR=packages/agent ;;
            *) echo "::error::unknown package '$NAME' (from '$TAG')"; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION=$(node -p "require('./$DIR/package.json').version")
            if [ "${TAG##*-v}" != "$VERSION" ]; then
              echo "::error::tag $TAG does not match $DIR version $VERSION"; exit 1
            fi
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: npm detects id-token and uses trusted publishing.
      - name: Publish
        run: npm publish -w ${{ steps.pkg.outputs.dir }} --access public
